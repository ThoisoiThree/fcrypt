[package]
name = "fcrypt"
version = "0.3.2"
edition = "2021"
rust-version = "1.74"
description = "Cross-platform CLI for password-based file encryption and decryption"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ThoisoiThree/fcrypt"
homepage = "https://github.com/ThoisoiThree/fcrypt"
documentation = "https://docs.rs/fcrypt"
keywords = ["encryption", "cli", "aes-gcm", "argon2", "security"]
categories = ["command-line-utilities", "cryptography"]
autobins = false

[features]
default = ["pqc"]
pqc = ["dep:oqs"]

[[bin]]
name = "fcrypt"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.5.3"
clap = { version = "4.5.38", features = ["derive"] }
indicatif = "0.18.4"
base64 = "0.22"
ciborium = "0.2"
hex = "0.4"
hkdf = "0.12"
oqs = { version = "0.11", optional = true, default-features = false, features = ["std", "kems", "sigs", "vendored"] }
rand = "0.8.6"
rpassword = "7.5.1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha3 = "0.10"
tempfile = "3.13.0"
thiserror = "1.0.64"
zeroize = "1.8.1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
panic = "abort"
